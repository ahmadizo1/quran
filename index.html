<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Quran Recordings</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f50">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d2a24;--muted:#6b7a72;--accent:#1f6f50;--line:#e2ded3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--text:#e8efe9;--muted:#93a39a;--accent:#4fb88c;--line:#2b3731;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:1.3rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item.on{color:var(--accent);font-weight:600}
.ar{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;font-size:1.3rem}
.sub{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button.b,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
button.b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.play{background:var(--accent);color:#fff;border:0;border-radius:50%;width:56px;height:56px;font-size:1.3rem;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.t{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem}
#msg{color:#c0392b;font-size:.9rem;margin-top:8px;min-height:1em}
[hidden]{display:none!important}
a.b{text-decoration:none;display:inline-block}
#q{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:8px}
</style>
</head>
<body>
<h1>My Quran Recordings</h1>

<div class="card" id="player">
  <div class="ar" id="nowAr">—</div>
  <div class="sub" id="nowEn">Choose a surah below</div>
  <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
  <div class="t"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="row" style="justify-content:center">
    <button class="b" id="back">−10s</button>
    <button class="play" id="pp" aria-label="Play/Pause">▶</button>
    <button class="b" id="fwd">+10s</button>
  </div>
  <div class="row">
    <select id="speed" aria-label="Speed">
      <option value="0.5">0.5×</option><option value="0.75">0.75×</option>
      <option value="1" selected>1×</option><option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option><option value="2">2×</option>
    </select>
    <button class="b" id="loop">Repeat surah</button>
    <button class="b" id="ab">Set A</button>
    <a class="b" id="dl" download hidden>Download</a>
  </div>
  <div id="msg"></div>
</div>

<div class="card"><input id="q" type="search" placeholder="Search surah name or number" aria-label="Search"><div id="list"></div></div>
<audio id="a" preload="metadata"></audio>

<script>
// ADD MORE SURAHS HERE: one line each. "file" can be a local path or a full https link.
const SURAHS = [
  {n:1,  ar:"الفاتحة",   en:"Al-Fatiha",    file:"audio/001.mp3"},
  {n:2,  ar:"البقرة",    en:"Al-Baqarah",   file:"audio/002.mp3"},
  {n:3,  ar:"آل عمران",  en:"Ali 'Imran",   file:"audio/003.mp3"},
  {n:18, ar:"الكهف",     en:"Al-Kahf",      file:"audio/018.mp3"},
  {n:72, ar:"الجن",      en:"Al-Jinn",      file:"audio/072.mp3"}
];

const $ = id => document.getElementById(id);
const a = $("a"); let idx = -1, A = null, B = null, abState = 0;
const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

function render(){
  const q = $("q").value.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]/g,"");
  const rows = SURAHS.map((s,i)=>({s,i})).filter(({s}) =>
    !q || (String(s.n)+s.en.toLowerCase().replace(/[^a-z0-9]/g,"")+s.ar.replace(/[^\u0600-\u06FF]/g,"")).includes(q));
  $("list").innerHTML = rows.length ? rows.map(({s,i})=>
    `<button class="item ${i===idx?"on":""}" data-i="${i}"><span>${s.n}. ${s.en}</span><span class="ar">${s.ar}</span></button>`
  ).join("") : '<div class="sub" style="padding:12px">No match</div>';
}
function load(i, autoplay){
  idx = i; const s = SURAHS[i];
  a.src = s.file; $("msg").textContent = "";
  const dl = $("dl"); dl.href = s.file; dl.download = s.en.replace(/\W+/g,"-")+".mp3"; dl.hidden = false;
  $("nowAr").textContent = s.ar; $("nowEn").textContent = s.n+". "+s.en;
  A = B = null; abState = 0; $("ab").textContent = "Set A"; $("ab").classList.remove("on");
  a.playbackRate = parseFloat($("speed").value);
  const saved = parseFloat(store.get("pos"+s.n)||0);
  a.addEventListener("loadedmetadata", function f(){ if(saved>0 && saved<a.duration-3) a.currentTime = saved; a.removeEventListener("loadedmetadata", f); });
  store.set("last", i); render();
  if(autoplay) a.play().catch(()=>{});
  if("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:s.en, artist:"My recordings"});
}
$("list").onclick = e => { const b = e.target.closest(".item"); if(b) load(+b.dataset.i, true); };
$("pp").onclick = () => { if(idx<0) return load(0,true); a.paused ? a.play().catch(()=>{}) : a.pause(); };
$("back").onclick = () => a.currentTime = Math.max(0, a.currentTime-10);
$("fwd").onclick = () => a.currentTime = Math.min(a.duration||0, a.currentTime+10);
$("speed").onchange = () => a.playbackRate = parseFloat($("speed").value);
$("loop").onclick = () => { a.loop = !a.loop; $("loop").classList.toggle("on", a.loop); };
$("ab").onclick = () => {
  if(idx<0) return;
  if(abState===0){ A = a.currentTime; abState = 1; $("ab").textContent = "Set B"; }
  else if(abState===1){ B = a.currentTime; if(B<=A){ [A,B]=[B,A]; } abState = 2; $("ab").textContent = "Clear A–B"; $("ab").classList.add("on"); a.currentTime = A; }
  else { A = B = null; abState = 0; $("ab").textContent = "Set A"; $("ab").classList.remove("on"); }
};
$("seek").oninput = () => { if(a.duration) a.currentTime = a.duration*$("seek").value/100; };
a.onplay = () => $("pp").textContent = "⏸";
a.onpause = () => $("pp").textContent = "▶";
a.ontimeupdate = () => {
  if(abState===2 && B!==null && a.currentTime>=B) a.currentTime = A;
  if(a.duration) $("seek").value = a.currentTime/a.duration*100;
  $("cur").textContent = fmt(a.currentTime); $("dur").textContent = fmt(a.duration);
  if(idx>=0 && Math.floor(a.currentTime)%3===0) store.set("pos"+SURAHS[idx].n, a.currentTime);
};
a.onended = () => { if(!a.loop && idx<SURAHS.length-1) load(idx+1, true); };
a.onerror = () => { $("msg").textContent = "Audio not found. Add the file: " + SURAHS[idx].file; };

$("q").oninput = render;
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
const last = parseInt(store.get("last"));
if(!isNaN(last) && SURAHS[last]) load(last, false);
</script>
</body>
</html>
