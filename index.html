<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Quran Recordings</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f50">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quran">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d2a24;--muted:#6b7a72;--accent:#1f6f50;--line:#e2ded3;--nav:60px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--text:#e8efe9;--muted:#93a39a;--accent:#4fb88c;--line:#2b3731;color-scheme:dark}}
:root[data-theme="light"]{--bg:#f6f4ef;--card:#fff;--text:#1d2a24;--muted:#6b7a72;--accent:#1f6f50;--line:#e2ded3;color-scheme:light}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--text:#e8efe9;--muted:#93a39a;--accent:#4fb88c;--line:#2b3731;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin-inline:auto}
header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 8px}
header img{width:36px;height:36px;border-radius:10px}
h1{font-size:1.25rem;margin:0}
h2{font-size:1.1rem;margin:10px 0 14px}
.view{padding:8px 20px calc(var(--nav) + 150px)}
.sub{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:48px 10px;line-height:1.7}
#q{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;margin:8px 0 16px}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer}
.item.on{border-color:var(--accent)}
.num{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:600;font-size:.9rem;color:var(--accent)}
.nm{display:flex;flex-direction:column;gap:3px}
.ar{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;font-size:1.5rem}
.ok{color:var(--accent);font-size:.75rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:16px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.stack{display:flex;flex-direction:column;gap:10px;padding:14px 0}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
#more .btn{text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;height:var(--nav);border:0;background:none;color:var(--muted);font:inherit;font-size:.72rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav i{font-style:normal;font-size:1.3rem;line-height:1}
nav button.on{color:var(--accent);font-weight:600}
#mini{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 10px);max-width:536px;margin-inline:auto;display:flex;align-items:center;gap:12px;background:var(--accent);color:#fff;border-radius:16px;padding:10px 14px;z-index:9;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#mini b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini button{background:rgba(255,255,255,.22);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:1rem;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet>div{max-width:520px;margin-inline:auto}
.art{height:230px;border-radius:24px;margin:16px 0 20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),#0e3a29) center/cover}
.art .ar{font-size:3.2rem;text-shadow:0 2px 10px rgba(0,0,0,.4)}
input[type=range]{width:100%;accent-color:var(--accent)}
.t{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem}
.ctl{display:flex;justify-content:center;align-items:center;gap:20px;margin:22px 0}
.play{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:1.8rem;cursor:pointer}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#more{margin-top:18px;display:flex;flex-direction:column;gap:10px}
#msg{color:#c0392b;font-size:.9rem;text-align:center;margin-top:12px;min-height:1em}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><img id="logo" alt=""><h1 id="title"></h1></header>

<main class="view" id="view-lib">
  <input id="q" type="search" placeholder="Search surah name or number" aria-label="Search">
  <div id="list"></div>
</main>

<main class="view" id="view-dl" hidden>
  <h2>Downloaded</h2>
  <p class="sub" style="margin-top:-8px">Saved inside the app. These play without internet.</p>
  <div id="dlList"></div>
</main>

<main class="view" id="view-set" hidden>
  <h2>Settings</h2>
  <div class="card">
    <div class="set"><label for="sTheme">Theme</label><select class="btn" id="sTheme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
    <div class="set"><label for="sSpeed">Default speed</label><select class="btn" id="sSpeed"></select></div>
    <div class="set"><label for="sSkip">Skip buttons</label><select class="btn" id="sSkip"></select></div>
    <div class="set"><label for="sNext">Play next surah automatically</label><input type="checkbox" id="sNext"></div>
  </div>
  <div class="card">
    <div class="set"><span>Storage used by app</span><b id="used">—</b></div>
    <div class="stack"><button class="btn" id="delAll">Delete all downloads</button><button class="btn" id="resetPos">Forget saved positions</button></div>
  </div>
</main>

<section class="sheet" id="player" hidden><div>
  <button class="btn" id="close">‹ Back</button>
  <div class="art" id="art"><span class="ar" id="nowAr">—</span></div>
  <h2 id="nowEn" style="text-align:center;margin:0 0 16px">—</h2>
  <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
  <div class="t"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl"><button class="btn" id="back">−10s</button><button class="play" id="pp" aria-label="Play or pause">▶</button><button class="btn" id="fwd">+10s</button></div>
  <div class="chips"><select class="btn" id="speed" aria-label="Speed"></select><button class="btn" id="loop">Repeat</button><button class="btn" id="moreBtn">More ▾</button></div>
  <div id="more" hidden>
    <button class="btn" id="ab">Loop a section: set start</button>
    <button class="btn" id="off" hidden>Save offline</button>
    <a class="btn" id="dl" download hidden>Save file to phone</a>
  </div>
  <div id="msg"></div>
</div></section>

<div id="mini" hidden><b id="miniT"></b><button id="miniPP" aria-label="Play or pause">▶</button></div>
<nav>
  <button data-v="lib" class="on"><i>📖</i><span>Library</span></button>
  <button data-v="dl"><i>⬇</i><span id="navDlT">Downloads</span></button>
  <button data-v="set"><i>⚙</i><span>Settings</span></button>
</nav>
<audio id="a" preload="metadata"></audio>

<script>
// ===== EASY SETTINGS: change the name and logo here =====
const APP = { name:"My Quran Recordings", logo:"icon-192.png" };
// ADD MORE SURAHS: one line each. "file" can be a local path or a full https link.
// OPTIONAL PICTURE: add   img:"images/fatiha.jpg"   to a line to show a picture on that surah's player screen.
const SURAHS = [
  {n:1,  ar:"الفاتحة",   en:"Al-Fatiha",    file:"001.mp3"},
  {n:2,  ar:"البقرة",    en:"Al-Baqarah",   file:"audio/002.mp3"},
  {n:3,  ar:"آل عمران",  en:"Ali 'Imran",   file:"audio/003.mp3"},
  {n:18, ar:"الكهف",     en:"Al-Kahf",      file:"audio/018.mp3"},
  {n:72, ar:"الجن",      en:"Al-Jinn",      file:"audio/072.mp3"}
];

const $ = id => document.getElementById(id);
const a = $("a"); let idx = -1, A = null, B = null, abState = 0, objUrl = null;
const saved = new Set(), CN = "quran-audio", hasCache = "caches" in window;
const key = s => new URL(s.file, location.href).href;
const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
document.title = APP.name; $("title").textContent = APP.name;
if(APP.logo) $("logo").src = APP.logo; else $("logo").hidden = true;

let stored = {}; try{ stored = JSON.parse(store.get("cfg")||"{}"); }catch(e){}
const cfg = Object.assign({theme:"auto", speed:1, skip:10, next:true}, stored);
function applyCfg(){
  const r = document.documentElement;
  if(cfg.theme==="auto") r.removeAttribute("data-theme"); else r.dataset.theme = cfg.theme;
  $("back").textContent = "−"+cfg.skip+"s"; $("fwd").textContent = "+"+cfg.skip+"s";
  store.set("cfg", JSON.stringify(cfg));
}
[0.5,0.75,1,1.25,1.5,2].forEach(v => ["speed","sSpeed"].forEach(id => {
  const o = document.createElement("option"); o.value = v; o.textContent = v+"×"; $(id).appendChild(o); }));
[5,10,15,30].forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v+" seconds"; $("sSkip").appendChild(o); });
$("sTheme").value = cfg.theme; $("sSpeed").value = cfg.speed; $("speed").value = cfg.speed;
$("sSkip").value = cfg.skip; $("sNext").checked = cfg.next; applyCfg();
$("sTheme").onchange = e => { cfg.theme = e.target.value; applyCfg(); };
$("sSpeed").onchange = e => { cfg.speed = +e.target.value; $("speed").value = cfg.speed; a.playbackRate = cfg.speed; applyCfg(); };
$("sSkip").onchange = e => { cfg.skip = +e.target.value; applyCfg(); };
$("sNext").onchange = e => { cfg.next = e.target.checked; applyCfg(); };

function show(v){
  ["lib","dl","set"].forEach(k => $("view-"+k).hidden = k!==v);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v===v));
  if(v==="set") usage();
  scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.v));

const showMini = () => { $("mini").hidden = idx<0 || !$("player").hidden; };
function openPlayer(){ if($("player").hidden) history.pushState({p:1},""); $("player").hidden = false; showMini(); }
function closePlayer(){ $("player").hidden = true; showMini(); }
$("close").onclick = () => { if(history.state && history.state.p) history.back(); else closePlayer(); };
window.onpopstate = closePlayer;
$("mini").onclick = openPlayer;
$("moreBtn").onclick = () => { const h = $("more").hidden; $("more").hidden = !h; $("moreBtn").textContent = h ? "Less ▴" : "More ▾"; };

async function usage(){
  try{ const e = await navigator.storage.estimate(); $("used").textContent = Math.round((e.usage||0)/1048576)+" MB"; }
  catch(e){ $("used").textContent = "—"; }
}
async function refreshSaved(){
  saved.clear();
  if(hasCache){ try{ (await (await caches.open(CN)).keys()).forEach(r => saved.add(r.url)); }catch(e){} }
  render(); updOff(); usage();
}
function updOff(){
  const b = $("off");
  if(idx<0 || !hasCache){ b.hidden = true; return; }
  b.hidden = false; b.textContent = saved.has(key(SURAHS[idx])) ? "Remove offline copy" : "Save offline";
}
$("off").onclick = async () => {
  if(idx<0 || !hasCache) return;
  const s = SURAHS[idx], b = $("off");
  try{
    if(saved.has(key(s))) await (await caches.open(CN)).delete(key(s));
    else{
      b.disabled = true; b.textContent = "Saving… please wait";
      const r = await fetch(s.file); if(!r.ok) throw new Error("bad");
      await (await caches.open(CN)).put(key(s), r);
      if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
    }
  }catch(e){ $("msg").textContent = "Could not save offline. Check your connection and that the audio file exists."; }
  b.disabled = false; refreshSaved();
};
$("delAll").onclick = async () => {
  if(!confirm("Delete all downloaded recordings from this app?")) return;
  try{ await caches.delete(CN); }catch(e){} refreshSaved();
};
$("resetPos").onclick = () => SURAHS.forEach(s => { try{ localStorage.removeItem("pos"+s.n); }catch(e){} });

const rowHtml = (s,i) =>
  `<button class="item${i===idx?" on":""}" data-i="${i}"><span class="num">${s.n}</span><span class="nm"><b>${s.en}</b>${saved.has(key(s))?'<small class="ok">✓ saved offline</small>':""}</span><span class="ar">${s.ar}</span></button>`;
function render(){
  const q = $("q").value.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]/g,"");
  const rows = SURAHS.map((s,i) => ({s,i}));
  const lib = rows.filter(({s}) => !q || (String(s.n)+s.en.toLowerCase().replace(/[^a-z0-9]/g,"")+s.ar.replace(/[^\u0600-\u06FF]/g,"")).includes(q));
  $("list").innerHTML = lib.length ? lib.map(r => rowHtml(r.s,r.i)).join("") : '<p class="empty">No match</p>';
  const dls = rows.filter(({s}) => saved.has(key(s)));
  $("dlList").innerHTML = dls.length ? dls.map(r => rowHtml(r.s,r.i)).join("") : '<p class="empty">Nothing downloaded yet.<br>Open a surah, tap “More”,<br>then “Save offline”.</p>';
  $("navDlT").textContent = "Downloads" + (saved.size ? " ("+saved.size+")" : "");
}
const rowClick = e => { const b = e.target.closest(".item"); if(b){ load(+b.dataset.i, true); openPlayer(); } };
$("list").onclick = rowClick; $("dlList").onclick = rowClick;

async function load(i, autoplay){
  idx = i; const s = SURAHS[i];
  $("msg").textContent = "";
  $("nowAr").textContent = s.ar; $("nowEn").textContent = s.n+". "+s.en; $("miniT").textContent = s.en+" · "+s.ar;
  $("art").style.backgroundImage = s.img ? `linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url("${s.img}")` : "";
  A = B = null; abState = 0; $("ab").textContent = AB_TXT[0]; $("ab").classList.remove("on");
  if(objUrl){ URL.revokeObjectURL(objUrl); objUrl = null; }
  let src = s.file;
  if(hasCache && saved.has(key(s))){
    try{ const m = await (await caches.open(CN)).match(key(s)); if(m){ objUrl = URL.createObjectURL(await m.blob()); src = objUrl; } }catch(e){}
  }
  if(idx !== i) return;
  a.src = src; a.playbackRate = parseFloat($("speed").value);
  const pos = parseFloat(store.get("pos"+s.n)||0);
  a.addEventListener("loadedmetadata", function f(){ if(pos>0 && pos<a.duration-3) a.currentTime = pos; a.removeEventListener("loadedmetadata", f); });
  const dl = $("dl"); dl.href = s.file; dl.download = s.en.replace(/\W+/g,"-")+".mp3"; dl.hidden = false;
  store.set("last", i); render(); updOff(); showMini();
  if(autoplay) a.play().catch(()=>{});
  if("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:s.en, artist:APP.name});
}

const setPP = t => { $("pp").textContent = t; $("miniPP").textContent = t; };
const toggle = () => { if(idx<0) return; a.paused ? a.play().catch(()=>{}) : a.pause(); };
$("pp").onclick = toggle; $("miniPP").onclick = e => { e.stopPropagation(); toggle(); };
$("back").onclick = () => a.currentTime = Math.max(0, a.currentTime-cfg.skip);
$("fwd").onclick = () => a.currentTime = Math.min(a.duration||0, a.currentTime+cfg.skip);
$("speed").onchange = () => a.playbackRate = parseFloat($("speed").value);
$("loop").onclick = () => { a.loop = !a.loop; $("loop").classList.toggle("on", a.loop); };
const AB_TXT = ["Loop a section: set start","Now set the end of the section","Clear section loop"];
$("ab").onclick = () => {
  if(idx<0) return;
  if(abState===0){ A = a.currentTime; abState = 1; }
  else if(abState===1){ B = a.currentTime; if(B<=A){ [A,B] = [B,A]; } abState = 2; a.currentTime = A; }
  else { A = B = null; abState = 0; }
  $("ab").textContent = AB_TXT[abState]; $("ab").classList.toggle("on", abState===2);
};
$("seek").oninput = () => { if(a.duration) a.currentTime = a.duration*$("seek").value/100; };
a.onplay = () => setPP("⏸");
a.onpause = () => setPP("▶");
a.ontimeupdate = () => {
  if(abState===2 && B!==null && a.currentTime>=B) a.currentTime = A;
  if(a.duration) $("seek").value = a.currentTime/a.duration*100;
  $("cur").textContent = fmt(a.currentTime); $("dur").textContent = fmt(a.duration);
  if(idx>=0 && Math.floor(a.currentTime)%3===0) store.set("pos"+SURAHS[idx].n, a.currentTime);
};
a.onended = () => { if(!a.loop && cfg.next && idx<SURAHS.length-1) load(idx+1, true); };
a.onerror = () => { if(idx>=0) $("msg").textContent = "Audio not found. Add the file: " + SURAHS[idx].file; };

$("q").oninput = render;
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
show("lib");
refreshSaved().then(() => { const last = parseInt(store.get("last")); if(!isNaN(last) && SURAHS[last]) load(last, false); });
</script>
</body>
</html>
